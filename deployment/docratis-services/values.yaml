#deployment/docratis-services/values.yaml
replicaCount: 1

image:
  registryPrefix: docratis    
  pullPolicy: Always
  tag: latest

service:
  type: ClusterIP

# The store connection strings and the one-off seed password carry credentials, so they are NOT in
# the source and NOT in this file - they come from a Secret that lives outside the repository.
# The application reads Stores__Document, Stores__Blob, Stores__Column and, on a first start only,
# Seed__AdminPassword; a missing value stops the service with an explicit message.
#
#   kubectl -n <namespace> create secret generic docratis-store-secrets \
#     --from-literal=Stores__Document='mongodb://<user>:<password>@<host>:27017/<db>?directConnection=true' \
#     --from-literal=Stores__Blob='mongodb://<user>:<password>@<host>:27017/<db>?directConnection=true' \
#     --from-literal=Stores__Column='host=<host>;port=9042;username=<user>;password=<password>;keyspace=<keyspace>'
#
# then point the chart at it:
#
#   envFrom:
#     - secretRef:
#         name: docratis-store-secrets
envFrom: []
env: []

ingress:
  enabled: false

autoscaling:
  enabled: false

# Portokhoz tartozó alap containerPort értékek
portDefinitions:
  http: 8080
  https: 8443
  grpc: 5000
  grpcs: 5001

probes:
  liveness:
    path: /health/live
    portName: http
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health/ready
    portName: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

resources: {}
serviceAccount:
  create: true
  automount: true

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}