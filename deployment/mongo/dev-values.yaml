# mongo/values.yaml
architecture: standalone

auth:
  enabled: true
  rootUser: root
  rootPassword: "CHANGE_ME"      # supply at install time: --set auth.rootPassword=...
  username: "docratis"
  password: "CHANGE_ME"          # supply at install time: --set auth.password=...
  database: "docratis_documents"

service:
  type: NodePort
  nodePorts:
    mongodb: 30017   # fix port on host machine
  port: 27017

persistence:
  enabled: true
  size: 8Gi
